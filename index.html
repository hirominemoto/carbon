<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>東京タワー周辺リアル夜景 3D・360度（芝公園・増上寺・大門・麻布台）</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #04070f; font-family: 'Hiragino Kaku Gothic ProN', 'Meiryo', sans-serif; }
        canvas { display: block; }
        #ui {
            position: absolute; top: 16px; left: 16px; color: #fff; z-index: 10;
            background: rgba(8, 12, 24, 0.84); padding: 14px 18px; border-radius: 12px;
            border: 1px solid rgba(255, 140, 60, 0.35);
            box-shadow: 0 6px 24px rgba(0,0,0,0.7);
            max-width: 430px;
        }
        h1 { margin: 0 0 4px 0; font-size: 16px; color: #ff7733; letter-spacing: 0.5px; }
        p { margin: 3px 0; font-size: 12px; color: #ccc; }
        .btn-row { margin-top: 9px; display: flex; gap: 6px; flex-wrap: wrap; }
        button {
            padding: 6px 11px; font-size: 12px; cursor: pointer;
            background: #23304a; color: #eee; border: 1px solid #44587a; border-radius: 5px;
            font-weight: bold; transition: 0.18s;
        }
        button:hover { background: #354970; color: #fff; }
        button.primary { background: #e64d00; border-color: #ff7733; color: #fff; }
        button.primary:hover { background: #ff661a; }
        button.recording { background: #cc0000 !important; border-color: #ff4444 !important; }
        #status { margin-top: 7px; font-size: 11px; color: #88bbff; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
    <div id="ui">
        <h1>🗼 東京タワー・芝公園・増上寺・大門 3D夜景</h1>
        <p>🖱️ 左ドラッグ: 回転 / 右ドラッグ: 移動 / ホイール: ズーム</p>
        <div class="btn-row">
            <button id="viewOrbit" class="primary">🌏 360度周回</button>
            <button id="viewZojoji">⛩️ 増上寺・大門視点</button>
            <button id="viewAkabane">🛣️ 赤羽橋・桜田通り視点</button>
            <button id="viewShiba">🌲 芝公園・プリンス視点</button>
        </div>
        <div class="btn-row">
            <button id="toggleRotBtn">自動回転: ON</button>
            <button id="toggleLabelBtn">名所ラベル: ON</button>
            <button id="recordBtn" class="primary">🎥 360度動画を録画 (18秒)</button>
        </div>
        <div id="status">港区の地形・建物を構築中...</div>
    </div>

    <script>
        window.addEventListener('load', function() {
            const statusEl = document.getElementById('status');
            if (typeof THREE === 'undefined') {
                statusEl.textContent = 'Three.jsの読み込みに失敗しました。ネット接続をご確認ください。';
                return;
            }

            try {
                // =========================================================
                // 1. シーン・カメラ・レンダラー設定
                // 方角定義: 北 = -Z, 南 = +Z, 東(増上寺・大門) = +X, 西(麻布台) = -X
                // =========================================================
                const scene = new THREE.Scene();
                scene.background = new THREE.Color(0x050914);
                scene.fog = new THREE.FogExp2(0x060b18, 0.00105);

                const camera = new THREE.PerspectiveCamera(44, window.innerWidth / window.innerHeight, 1, 2500);
                const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
                renderer.setSize(window.innerWidth, window.innerHeight);
                renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
                document.body.appendChild(renderer.domElement);

                // スムーズ補間つきカメラコントローラー
                const cam = {
                    target: new THREE.Vector3(10, 42, 0),
                    goalTarget: new THREE.Vector3(10, 42, 0),
                    radius: 265, goalRadius: 265,
                    theta: 0.45, goalTheta: 0.45,
                    phi: 1.18,   goalPhi: 1.18,
                    autoRotate: true,
                    rotSpeed: 0.0032,
                    dragging: false, mode: 0, px: 0, py: 0,
                    update: function() {
                        if (this.autoRotate && !this.dragging) {
                            this.goalTheta += this.rotSpeed;
                        }
                        this.theta += (this.goalTheta - this.theta) * 0.08;
                        this.phi   += (this.goalPhi - this.phi) * 0.08;
                        this.radius += (this.goalRadius - this.radius) * 0.08;
                        this.target.lerp(this.goalTarget, 0.08);

                        const sp = Math.sin(this.phi);
                        camera.position.set(
                            this.target.x + this.radius * sp * Math.cos(this.theta),
                            this.target.y + this.radius * Math.cos(this.phi),
                            this.target.z + this.radius * sp * Math.sin(this.theta)
                        );
                        camera.lookAt(this.target);
                    }
                };

                const dom = renderer.domElement;
                dom.addEventListener('contextmenu', e => e.preventDefault());
                dom.addEventListener('mousedown', e => {
                    cam.dragging = true; cam.mode = e.button; cam.px = e.clientX; cam.py = e.clientY;
                });
                window.addEventListener('mouseup', () => { cam.dragging = false; });
                window.addEventListener('mousemove', e => {
                    if (!cam.dragging) return;
                    const dx = e.clientX - cam.px, dy = e.clientY - cam.py;
                    cam.px = e.clientX; cam.py = e.clientY;
                    if (cam.mode === 0) {
                        cam.goalTheta += dx * 0.0065;
                        cam.goalPhi = Math.max(0.15, Math.min(Math.PI / 2 - 0.025, cam.goalPhi - dy * 0.0065));
                    } else {
                        const right = new THREE.Vector3(-Math.sin(cam.theta), 0, Math.cos(cam.theta));
                        const forward = new THREE.Vector3(-Math.cos(cam.theta), 0, -Math.sin(cam.theta));
                        cam.goalTarget.addScaledVector(right, -dx * 0.3);
                        cam.goalTarget.addScaledVector(forward, dy * 0.3);
                    }
                });
                dom.addEventListener('wheel', e => {
                    e.preventDefault();
                    cam.goalRadius = Math.max(35, Math.min(620, cam.goalRadius + e.deltaY * 0.18));
                }, { passive: false });

                // =========================================================
                // 2. ライティング（森の陰影・寺院の荘厳さ・タワーの暖色光）
                // =========================================================
                scene.add(new THREE.HemisphereLight(0x3a5588, 0x101820, 1.25));

                const moonLight = new THREE.DirectionalLight(0x7799cc, 0.9);
                moonLight.position.set(180, 320, -140);
                scene.add(moonLight);

                // 東京タワーからのランドマークライト照り返し
                const towerWarmLight = new THREE.PointLight(0xff6611, 2.6, 260);
                towerWarmLight.position.set(0, 68, 0);
                scene.add(towerWarmLight);

                // 増上寺のライトアップ照明
                const templeLight = new THREE.PointLight(0xffbb66, 1.6, 110);
                templeLight.position.set(112, 22, 0);
                scene.add(templeLight);

                // =========================================================
                // 3. プロシージャル・テクスチャ群
                // =========================================================
                function makeGlowTex(innerCol, midCol) {
                    const c = document.createElement('canvas');
                    c.width = 128; c.height = 128;
                    const ctx = c.getContext('2d');
                    const g = ctx.createRadialGradient(64, 64, 2, 64, 64, 64);
                    g.addColorStop(0, innerCol);
                    g.addColorStop(0.35, midCol);
                    g.addColorStop(1, 'rgba(0,0,0,0)');
                    ctx.fillStyle = g;
                    ctx.fillRect(0, 0, 128, 128);
                    return new THREE.CanvasTexture(c);
                }
                const orangeGlowTex = makeGlowTex('rgba(255,160,70,0.85)', 'rgba(255,90,20,0.28)');
                const warmGlowTex   = makeGlowTex('rgba(255,220,150,0.8)', 'rgba(255,160,60,0.22)');

                // 用途別ビル外観テクスチャ（オフィス・ホテル・麻布台ガラス・大門雑居ビル）
                function createArchTexture(type, seed) {
                    const c = document.createElement('canvas');
                    c.width = 256; c.height = 512;
                    const ctx = c.getContext('2d');

                    if (type === 'azabudai') {
                        // 麻布台ヒルズ風：シャンパンゴールドのガラスカーテンウォール＋曲線マリオン
                        ctx.fillStyle = '#1d2432';
                        ctx.fillRect(0, 0, 256, 512);
                        for (let r = 0; r < 40; r++) {
                            const lit = 0.45 + 0.35 * Math.sin(r * 0.7 + seed);
                            for (let col = 0; col < 10; col++) {
                                if (Math.random() < lit) {
                                    ctx.fillStyle = (Math.random() < 0.7) ? '#ffdfaa' : '#fff3d6';
                                } else {
                                    ctx.fillStyle = '#141c2b';
                                }
                                ctx.fillRect(col * 25 + 3, r * 12 + 2, 20, 9);
                            }
                            ctx.fillStyle = '#5c4a32';
                            ctx.fillRect(0, r * 12, 256, 2);
                        }
                        ctx.fillStyle = '#6e583b';
                        for (let x = 0; x < 256; x += 25) ctx.fillRect(x, 0, 3, 512);

                    } else if (type === 'prince_park') {
                        // ザ・プリンス パークタワー東京風：白いグリッドフレームと温かい客室窓
                        ctx.fillStyle = '#abb4c2';
                        ctx.fillRect(0, 0, 256, 512);
                        for (let r = 0; r < 28; r++) {
                            for (let col = 0; col < 8; col++) {
                                const isLit = Math.random() < 0.62;
                                ctx.fillStyle = isLit ? (Math.random() < 0.8 ? '#ffe0a3' : '#fff5dd') : '#1c2536';
                                ctx.fillRect(col * 32 + 5, r * 18 + 4, 22, 11);
                            }
                        }
                    } else if (type === 'tokyo_prince') {
                        // 東京プリンスホテル風：横長の白いバルコニーラインと暖色客室
                        ctx.fillStyle = '#252c38';
                        ctx.fillRect(0, 0, 256, 512);
                        for (let r = 0; r < 16; r++) {
                            for (let col = 0; col < 10; col++) {
                                ctx.fillStyle = (Math.random() < 0.68) ? '#ffd588' : '#161c26';
                                ctx.fillRect(col * 25 + 3, r * 32 + 6, 20, 14);
                            }
                            // 白い水平バルコニー手すり
                            ctx.fillStyle = '#cdd3de';
                            ctx.fillRect(0, r * 32 + 20, 256, 7);
                        }
                    } else if (type === 'daimon') {
                        // 大門・浜松町の商業・飲食店雑居ビル（1〜2階が明るい店舗、上階オフィス）
                        ctx.fillStyle = (seed % 2 === 0) ? '#2b2d36' : '#332d2b';
                        ctx.fillRect(0, 0, 256, 512);
                        for (let r = 0; r < 16; r++) {
                            const isShopFloor = (r >= 13);
                            for (let col = 0; col < 6; col++) {
                                if (isShopFloor) {
                                    ctx.fillStyle = (col % 2 === 0) ? '#ffdd99' : '#ffcc66';
                                    ctx.fillRect(col * 42 + 4, r * 32 + 4, 34, 24);
                                } else {
                                    ctx.fillStyle = (Math.random() < 0.5) ? '#d8f0ff' : (Math.random() < 0.4 ? '#ffe0a0' : '#141923');
                                    ctx.fillRect(col * 42 + 6, r * 32 + 8, 30, 16);
                                }
                            }
                            ctx.fillStyle = '#191c24';
                            ctx.fillRect(0, r * 32, 256, 4);
                        }
                    } else {
                        // 一般オフィス・マンション（浜松町・虎ノ門・芝エリア）
                        const walls = ['#202836', '#28303d', '#1c2330', '#2d333d'];
                        ctx.fillStyle = walls[seed % walls.length];
                        ctx.fillRect(0, 0, 256, 512);
                        for (let r = 0; r < 32; r++) {
                            const rowProb = 0.25 + 0.55 * Math.abs(Math.sin(r * 1.3 + seed));
                            for (let col = 0; col < 8; col++) {
                                if (Math.random() < rowProb) {
                                    const rnd = Math.random();
                                    ctx.fillStyle = rnd < 0.58 ? '#cceeff' : (rnd < 0.88 ? '#ffe4aa' : '#99ccff');
                                } else {
                                    ctx.fillStyle = '#101622';
                                }
                                ctx.fillRect(col * 32 + 5, r * 16 + 4, 22, 9);
                            }
                            ctx.fillStyle = '#131822';
                            ctx.fillRect(0, r * 16, 256, 3);
                        }
                    }

                    const t = new THREE.CanvasTexture(c);
                    t.wrapS = THREE.RepeatWrapping;
                    t.wrapT = THREE.RepeatWrapping;
                    return t;
                }

                // 東京タワーのトラス面テクスチャ（最下段はアーチ開口付き！）
                function createTowerPanelTexture(colorHex, hasArch) {
                    const c = document.createElement('canvas');
                    c.width = 256; c.height = 256;
                    const ctx = c.getContext('2d');
                    ctx.clearRect(0, 0, 256, 256);

                    ctx.strokeStyle = colorHex;
                    ctx.lineWidth = 12;

                    // 左右の主柱と上下フレーム
                    ctx.strokeRect(6, 6, 244, 244);

                    if (hasArch) {
                        // 東京タワー特有の足元の大きな放物線アーチ開口
                        ctx.beginPath();
                        ctx.moveTo(0, 0); ctx.lineTo(256, 85);
                        ctx.moveTo(256, 0); ctx.lineTo(0, 85);
                        ctx.moveTo(0, 85); ctx.lineTo(256, 85);
                        // 左右の脚内部トラス
                        ctx.moveTo(0, 85); ctx.lineTo(75, 256);
                        ctx.moveTo(256, 85); ctx.lineTo(181, 256);
                        ctx.moveTo(0, 170); ctx.lineTo(55, 170);
                        ctx.moveTo(201, 170); ctx.lineTo(256, 170);
                        ctx.stroke();

                        // アーチ曲線
                        ctx.lineWidth = 14;
                        ctx.beginPath();
                        ctx.moveTo(52, 256);
                        ctx.quadraticCurveTo(128, 82, 204, 256);
                        ctx.stroke();

                        // アーチ下を透明にくり抜く
                        ctx.globalCompositeOperation = 'destination-out';
                        ctx.beginPath();
                        ctx.moveTo(58, 256);
                        ctx.quadraticCurveTo(128, 94, 198, 256);
                        ctx.closePath();
                        ctx.fill();
                        ctx.globalCompositeOperation = 'source-over';
                    } else {
                        // Kブレース・Xブレース構造
                        ctx.beginPath();
                        ctx.moveTo(0, 0); ctx.lineTo(256, 128);
                        ctx.moveTo(256, 0); ctx.lineTo(0, 128);
                        ctx.moveTo(0, 128); ctx.lineTo(256, 128);
                        ctx.moveTo(0, 128); ctx.lineTo(256, 256);
                        ctx.moveTo(256, 128); ctx.lineTo(0, 256);
                        ctx.stroke();

                        ctx.lineWidth = 6;
                        ctx.beginPath();
                        ctx.moveTo(0, 64); ctx.lineTo(256, 64);
                        ctx.moveTo(0, 192); ctx.lineTo(256, 192);
                        ctx.moveTo(128, 0); ctx.lineTo(128, 256);
                        ctx.stroke();
                    }
                    return new THREE.CanvasTexture(c);
                }

                // 地面マップ（芝公園の緑地・増上寺境内・日比谷通り・桜田通り・大門通りを描き分け）
                function createMinatoGroundTexture() {
                    const c = document.createElement('canvas');
                    c.width = 2048; c.height = 2048;
                    const ctx = c.getContext('2d');
                    // ワールド座標 -500〜+500 を 0〜2048 にマッピング
                    const toPx = v => (v + 500) / 1000 * 2048;

                    // 1. 都市市街地ベース（アスファルト＆街区）
                    ctx.fillStyle = '#0d121c';
                    ctx.fillRect(0, 0, 2048, 2048);

                    // 市街地の細かい路地グリッド（大門・浜松町・虎ノ門・麻布エリア）
                    ctx.strokeStyle = '#161e2e';
                    ctx.lineWidth = 6;
                    for (let v = -480; v <= 480; v += 45) {
                        ctx.beginPath(); ctx.moveTo(toPx(v), 0); ctx.lineTo(toPx(v), 2048); ctx.stroke();
                        ctx.beginPath(); ctx.moveTo(0, toPx(v)); ctx.lineTo(2048, toPx(v)); ctx.stroke();
                    }

                    // 2. 芝公園・紅葉谷の緑地エリア（道路グリッドを上書きして自然な公園地形にする）
                    ctx.fillStyle = '#0b1c14';
                    ctx.beginPath();
                    ctx.ellipse(toPx(45), toPx(30), 390, 440, 0.1, 0, Math.PI * 2);
                    ctx.fill();

                    // 芝公園4号地・プリンスパークタワー前の円形芝生広場＆遊歩道
                    ctx.fillStyle = '#11291b';
                    ctx.beginPath();
                    ctx.arc(toPx(112), toPx(88), 95, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.strokeStyle = '#3b3528';
                    ctx.lineWidth = 7;
                    ctx.stroke();

                    // 3. 増上寺の境内（玉砂利と石畳参道）
                    ctx.fillStyle = '#1b1d22';
                    ctx.fillRect(toPx(65), toPx(-48), toPx(158) - toPx(65), toPx(48) - toPx(-48));
                    // 本堂への白い石畳
                    ctx.fillStyle = '#3a3d45';
                    ctx.fillRect(toPx(95), toPx(-7), toPx(160) - toPx(95), 28);

                    // 4. 主要幹線道路の描画
                    function drawRoad(x1, z1, x2, z2, widthPx, centerCol) {
                        ctx.strokeStyle = '#283142';
                        ctx.lineWidth = widthPx + 8;
                        ctx.beginPath(); ctx.moveTo(toPx(x1), toPx(z1)); ctx.lineTo(toPx(x2), toPx(z2)); ctx.stroke();

                        ctx.strokeStyle = '#0c1018';
                        ctx.lineWidth = widthPx;
                        ctx.beginPath(); ctx.moveTo(toPx(x1), toPx(z1)); ctx.lineTo(toPx(x2), toPx(z2)); ctx.stroke();

                        ctx.strokeStyle = centerCol || '#556680';
                        ctx.lineWidth = 2;
                        ctx.setLineDash([12, 12]);
                        ctx.beginPath(); ctx.moveTo(toPx(x1), toPx(z1)); ctx.lineTo(toPx(x2), toPx(z2)); ctx.stroke();
                        ctx.setLineDash([]);
                    }

                    // 日比谷通り（増上寺・三解脱門の正面を南北に縦断 X = 162）
                    drawRoad(162, -480, 162, 480, 34, '#ffaa44');
                    // 大門通り（三解脱門前から大門をくぐり浜松町駅方面へ東へ伸びる Z = 0, X = 162..480）
                    drawRoad(162, 0, 480, 0, 32, '#ffaa44');
                    // 国道1号・桜田通り（赤羽橋交差点から東京タワー西側をかすめて虎ノ門・神谷町へ北西に抜ける名道！）
                    drawRoad(-25, 175, -155, -450, 36, '#ff8822');
                    drawRoad(-25, 175, -35, 480, 34, '#ff8822');
                    // 環状三号線・麻布通り / 赤羽橋から東（芝公園南側）へ抜ける通り
                    drawRoad(-25, 175, 480, 175, 32);
                    drawRoad(-25, 175, -450, 80, 30);
                    // 第一京浜（国道15号・大門交差点 X = 275 を南北に走る大通り）
                    drawRoad(275, -480, 275, 480, 38, '#ffaa44');
                    // 御成門通り（東京プリンスホテル北側 Z = -125）
                    drawRoad(-120, -125, 480, -125, 26);

                    // 東京湾・日の出ふ頭方面（南東端の水面）
                    ctx.fillStyle = '#040914';
                    ctx.fillRect(toPx(395), toPx(-480), 300, 2048);

                    return new THREE.CanvasTexture(c);
                }

                const ground = new THREE.Mesh(
                    new THREE.PlaneGeometry(1000, 1000),
                    new THREE.MeshLambertMaterial({ map: createMinatoGroundTexture() })
                );
                ground.rotation.x = -Math.PI / 2;
                scene.add(ground);

                // =========================================================
                // 4. 東京タワー（紅葉谷の高台＋本物の放物線シルエット＋アーチ脚）
                // =========================================================
                const blinkingLights = [];

                function buildAuthenticTokyoTower() {
                    const wrap = new THREE.Group();

                    // タワーが立つ芝公園・紅葉谷の小高い丘
                    const hill = new THREE.Mesh(
                        new THREE.CylinderGeometry(34, 56, 6, 24),
                        new THREE.MeshLambertMaterial({ color: 0x0f2217 })
                    );
                    hill.position.y = 3;
                    wrap.add(hill);

                    const tower = new THREE.Group();
                    tower.position.y = 6; // 高台の上に設置

                    // フットタウン（足元の商業ビル）
                    const ftTex = createArchTexture('office', 3);
                    ftTex.repeat.set(2, 0.35);
                    const footTown = new THREE.Mesh(
                        new THREE.BoxGeometry(30, 9.5, 30),
                        new THREE.MeshLambertMaterial({ map: ftTex, emissive: 0x555555, emissiveMap: ftTex })
                    );
                    footTown.position.y = 4.75;
                    tower.add(footTown);

                    // 放物線カーブ関数: 高さ y (0〜112) に対するタワー半幅 w(y)
                    function halfWidthAt(y) {
                        if (y <= 42) {
                            // 地上〜大展望台：優美に広がる凹カーブ
                            const t = 1 - (y / 42);
                            return 8.2 + 13.8 * Math.pow(t, 1.55);
                        } else {
                            // 大展望台〜特別展望台〜上部
                            const t = 1 - ((y - 42) / 70);
                            return 2.0 + 6.0 * Math.pow(Math.max(0, t), 1.35);
                        }
                    }

                    const texOrangeArch = createTowerPanelTexture('#ff4500', true);
                    const texOrange     = createTowerPanelTexture('#ff4500', false);
                    const texWhite      = createTowerPanelTexture('#f5f5f5', false);

                    // 4面パネルで放物線の各段を精密構築
                    const tiers = [
                        { y0: 0,  y1: 20, tex: texOrangeArch, col: 0xff4500 },
                        { y0: 20, y1: 39, tex: texOrange,     col: 0xff4500 },
                        { y0: 47, y1: 60, tex: texWhite,      col: 0xffffff },
                        { y0: 60, y1: 74, tex: texOrange,     col: 0xff4500 },
                        { y0: 74, y1: 87, tex: texWhite,      col: 0xffffff },
                        { y0: 87, y1: 96, tex: texOrange,     col: 0xff4500 },
                        { y0: 101,y1: 112,tex: texWhite,      col: 0xffffff }
                    ];

                    tiers.forEach(t => {
                        const w0 = halfWidthAt(t.y0);
                        const w1 = halfWidthAt(t.y1);
                        const h = t.y1 - t.y0;
                        const mat = new THREE.MeshBasicMaterial({
                            map: t.tex, transparent: true, alphaTest: 0.12, side: THREE.DoubleSide
                        });

                        // 台形4面パネルを配置
                        for (let side = 0; side < 4; side++) {
                            const geo = new THREE.BufferGeometry();
                            const verts = new Float32Array([
                                -w0, t.y0, w0,   w0, t.y0, w0,   w1, t.y1, w1,
                                -w0, t.y0, w0,   w1, t.y1, w1,  -w1, t.y1, w1
                            ]);
                            const uvs = new Float32Array([

                // =========================================================
                // 反り（そり）のある日本建築の入母屋屋根を生成する関数
                function createCurvedJapaneseRoof(w, d, h, roofColor) {
                    const geo = new THREE.BoxGeometry(w, h, d, 10, 2, 10);
                    const pos = geo.attributes.position;
                    for (let i = 0; i < pos.count; i++) {
                        let vx = pos.getX(i), vy = pos.getY(i), vz = pos.getZ(i);
                        const nx = Math.abs(vx) / (w / 2);
                        const nz = Math.abs(vz) / (d / 2);
                        if (vy > 0) {
                            // 大棟に向かって絞り込みつつ、四隅の軒先を優雅に反り上げる
                            vx *= (1 - 0.55 * (1 - nx * 0.25));
                            vz *= 0.32 + 0.68 * Math.pow(nx, 1.6);
                            vy += Math.pow(Math.max(nx, nz), 2.4) * (h * 0.45);
                        } else {
                            vy += Math.pow(nx * nz, 1.5) * (h * 0.55);
                        }
                        pos.setXYZ(i, vx, vy, vz);
                    }
                    geo.computeVertexNormals();
                    return new THREE.Mesh(geo, new THREE.MeshLambertMaterial({ color: roofColor }));
                }

                // 6. 芝公園の森（InstancedMeshによる1,850本の木々と遊歩道街灯）
                // =========================================================
                function buildShibaParkForest() {
                    const treePositions = [];

                    function addForestZone(cx, cz, rx, rz, count, avoidTower) {
                        for (let i = 0; i < count; i++) {
                            const ang = Math.random() * Math.PI * 2;
                            const rad = Math.sqrt(Math.random());
                            const tx = cx + Math.cos(ang) * rx * rad;
                            const tz = cz + Math.sin(ang) * rz * rad;

                            // 道路・増上寺境内・建物の真上を避ける
                            if (avoidTower && Math.hypot(tx, tz) < 23) continue; // フットタウン上は除外
                            if (tx > 68 && tx < 156 && tz > -42 && tz < 42) continue; // 増上寺境内中心は空ける
                            if (Math.abs(tx - 162) < 12) continue; // 日比谷通り除外
                            if (Math.hypot(tx - 112, tz - 88) < 28) continue; // 円形芝生広場の中央は芝生として空ける！
                            if (Math.hypot(tx - 48, tz - 122) < 32) continue; // プリンスパークタワー敷地除外
                            if (tx > 25 && tx < 115 && tz < -65 && tz > -110) continue; // 東京プリンス敷地除外

                            // 桜田通りからの距離チェック
                            if (tx < -15 && tz > -150 && Math.abs((tx + 25) - (tz - 175) * 0.21) < 14) continue;

                            const baseH = (Math.hypot(tx, tz) < 55) ? 4.2 : 0; // タワー足元の高台補正
                            treePositions.push({ x: tx, y: baseH, z: tz, s: 0.75 + Math.random() * 0.85 });
                        }
                    }

                    // 紅葉谷・東京タワー周囲の森
                    addForestZone(5, 5, 78, 82, 580, true);
                    // 増上寺南側〜芝公園（丸山古墳・プリンスパークタワー周辺）の深い森
                    addForestZone(75, 98, 85, 68, 650, false);
                    // 増上寺北側・御成門・東京プリンス周辺の緑地
                    addForestZone(80, -62, 72, 48, 380, false);
                    // 日比谷通り・大門通りの街路樹
                    for (let z = -220; z <= 220; z += 14) {
                        if (Math.abs(z) > 12) {
                            treePositions.push({ x: 154, y: 0, z: z, s: 0.65 });
                            treePositions.push({ x: 170, y: 0, z: z, s: 0.65 });
                        }
                    }

                    const canopyGeo = new THREE.DodecahedronGeometry(3.4, 1);
                    const canopyMat = new THREE.MeshLambertMaterial({ color: 0x163822 });
                    const instTrees = new THREE.InstancedMesh(canopyGeo, canopyMat, treePositions.length);

                    const dummy = new THREE.Object3D();
                    const color = new THREE.Color();
                    treePositions.forEach((p, idx) => {
                        dummy.position.set(p.x, p.y + 3.2 * p.s, p.z);
                        dummy.scale.set(p.s * 1.15, p.s * 0.95, p.s * 1.15);
                        dummy.rotation.y = idx * 1.1;
                        dummy.updateMatrix();
                        instTrees.setMatrixAt(idx, dummy.matrix);

                        // タワーに近い木々はオレンジ色の照り返しを少し受ける
                        const distT = Math.hypot(p.x, p.z);
                        if (distT < 62) {
                            color.setRGB(0.18, 0.24, 0.14);
                        } else {
                            const g = 0.16 + (idx % 5) * 0.025;
                            color.setRGB(0.06, g, 0.10);
                        }
                        instTrees.setColorAt(idx, color);
                    });
                    scene.add(instTrees);

                    // 芝公園の遊歩道フットライト（森の中に浮かぶ温かい散策路の灯り）
                    const lampGeo = new THREE.SphereGeometry(0.55, 6, 6);
                    const lampMat = new THREE.MeshBasicMaterial({ color: 0xffdd99 });
                    for (let a = 0; a < Math.PI * 2; a += 0.35) {
                        const lx = 112 + Math.cos(a) * 34;
                        const lz = 88 + Math.sin(a) * 34;
                        const lamp = new THREE.Mesh(lampGeo, lampMat);
                        lamp.position.set(lx, 1.4, lz);
                        scene.add(lamp);
                    }
                }

                        b.add(hp);
                        const rl = new THREE.Mesh(new THREE.SphereGeometry(0.65, 6, 6), new THREE.MeshBasicMaterial({ color: 0xff1111 }));
                        rl.position.set(w * 0.4, h + 2.5, d * 0.4);
                        b.add(rl);
                        blinkingLights.push(rl);
                    } else {
                        // 雑居・中層ビルは塔屋と室外機
                        const ph = new THREE.Mesh(new THREE.BoxGeometry(w * 0.35, 3.5, d * 0.35), roofConcrete);
                        ph.position.set(w * 0.15, h + 2.2, d * 0.15);
                        const ac = new THREE.Mesh(new THREE.BoxGeometry(2.5, 1.6, 1.8), equipMat);
                        ac.position.set(-w * 0.2, h + 1.5, 0);
                        b.add(ph, ac);
                    }

                    // 大門・浜松町・新橋方面の飲食店街には「縦長の袖看板ネオン」を付与！
                    if (withNeon) {
                        const signCol = neonColors[seed % neonColors.length];
                        const signH = Math.min(8, h * 0.45);
                        const sign = new THREE.Mesh(new THREE.BoxGeometry(0.9, signH, 2.2), new THREE.MeshBasicMaterial({ color: signCol }));
                        sign.position.set(0, h * 0.45, (z < 0 ? d / 2 + 1.1 : -d / 2 - 1.1));
                        b.add(sign);
                    }

                    cityGroup.add(b);
                }

                // 1) 大門通りの門前町・飲食店雑居ビル街（X = 178〜265、通りの両側に密集して並ぶリアルな街並み！）
                let seedIdx = 1;
                for (let dx = 180; dx <= 262; dx += 15) {
                    if (Math.abs(dx - 225) < 8) continue; // 大門の柱位置は空ける
                    const hNorth = 16 + (seedIdx * 7) % 18;
                    const hSouth = 15 + (seedIdx * 11) % 20;
                    addCityBlockBuilding(dx, -18, 12, 14, hNorth, 'daimon', seedIdx++, true);
                    addCityBlockBuilding(dx,  18, 12, 14, hSouth, 'daimon', seedIdx++, true);
                }

                // 2) 大門・芝大門・浜松町のオフィス＆ホテル街区（X = 180〜375, Z = -280〜+260）
                for (let x = 185; x <= 375; x += 36) {
                    for (let z = -280; z <= 260; z += 36) {
                        if (Math.abs(z) < 28 && x < 285) continue; // 大門通り沿いは上で配置済み
                        if (Math.abs(x - 275) < 16) continue;      // 第一京浜道路を空ける
                        if (Math.abs(z - 175) < 16) continue;      // 南側幹線道路を空ける
                        if (Math.abs(z + 125) < 14) continue;      // 御成門通りを空ける

                        const isHamamatsuchoStation = (x > 295 && Math.abs(z) < 95); // 浜松町駅・貿易センタービル群エリア
                        let h = isHamamatsuchoStation
                            ? (85 + (seedIdx * 19) % 65)
                            : (26 + (seedIdx * 13) % 42);
                        const w = isHamamatsuchoStation ? 28 : (16 + (seedIdx % 10));
                        const d = isHamamatsuchoStation ? 28 : (16 + ((seedIdx * 3) % 10));
                        const hasSign = (!isHamamatsuchoStation && Math.abs(z) < 90 && seedIdx % 2 === 0);

                        addCityBlockBuilding(x, z, w, d, h, hasSign ? 'daimon' : 'office', seedIdx++, hasSign);
                    }
                }

                // 3) 北側遠景：虎ノ門ヒルズ・新橋・汐留の超高層スカイライン（Z = -240〜-380）
                [[-35, -285, 36, 36, 142], [-80, -300, 30, 30, 115], [15, -310, 30, 30, 108],
                 [195, -320, 34, 28, 125], [240, -335, 32, 32, 135]].forEach(([bx, bz, bw, bd, bh], i) => {
                    addCityBlockBuilding(bx, bz, bw, bd, bh, 'office', 100 + i, false);
                });

                // 4) 南側（赤羽橋・三田・芝浦方面 Z = 220〜360）＆ 西側（東麻布・飯倉・六本木方面 X = -85〜-360）
                for (let x = -350; x <= 145; x += 40) {
                    for (let z = -260; z <= 340; z += 40) {
                        // 芝公園・東京タワー・増上寺エリアは絶対に侵食しない！
                        if (x > -55 && x < 165 && z > -135 && z < 195) continue;
                        // 麻布台ヒルズ周辺は空ける
                        if (Math.hypot(x + 155, z + 85) < 78) continue;
                        // 桜田通りを空ける
                        if (Math.abs((x + 25) - (z - 175) * 0.29) < 20 && z < 190) continue;
                        if (Math.abs(z - 175) < 20) continue;
                        if ((seedIdx * 7) % 10 < 2) continue;

                        // 東麻布の低中層住宅・ビル街と、六本木方面の高層ビルのメリハリをつける
                        let h = 16 + (seedIdx * 11) % 28;
                        if (x < -240 && z < 40 && seedIdx % 4 === 0) h += 65; // 六本木ヒルズ・アークヒルズ方面
                        if (z > 240 && seedIdx % 5 === 0) h += 55;            // 三田住友・田町タワー方面
                        addCityBlockBuilding(x, z, 16 + (seedIdx % 10), 16 + ((seedIdx * 2) % 10), h, 'office', seedIdx++, false);
                    }
                }
                scene.add(cityGroup);

                // =========================================================
                // 8. 首都高速都心環状線（カーブする高架橋脚＋オレンジ街灯＋走る車列）
                // =========================================================
                const movingCars = [];

                function buildShutokoExpressway() {
                    const hwGroup = new THREE.Group();
                    // 芝公園南側から赤羽橋、一の橋（西側）へと大きくカーブする実在ルート
                    const curve = new THREE.CatmullRomCurve3([
                        new THREE.Vector3(380, 14, 155),
                        new THREE.Vector3(180, 14, 195),
                        new THREE.Vector3(10,  15, 208),
                        new THREE.Vector3(-95, 16, 175),
                        new THREE.Vector3(-195,16, 70),
                        new THREE.Vector3(-245,16, -90),
                        new THREE.Vector3(-265,16, -320)
                    ]);

                    // 高架道路デッキと遮音壁
                    const tubeGeo = new THREE.TubeGeometry(curve, 90, 6.5, 6, false);
                    tubeGeo.scale(1, 0.22, 1);
                    const roadDeck = new THREE.Mesh(tubeGeo, new THREE.MeshLambertMaterial({ color: 0x2c3342, emissive: 0x111520 }));
                    hwGroup.add(roadDeck);

                    // 高架橋脚とオレンジ色のナトリウム道路灯
                    const pierMat = new THREE.MeshLambertMaterial({ color: 0x3b4252 });
                    const sodiumMat = new THREE.MeshBasicMaterial({ color: 0xffaa33 });
                    for (let i = 1; i < 28; i++) {
                        const pt = curve.getPointAt(i / 28);
                        const pier = new THREE.Mesh(new THREE.BoxGeometry(3.2, pt.y, 3.2), pierMat);
                        pier.position.set(pt.x, pt.y / 2, pt.z);
                        const lamp = new THREE.Mesh(new THREE.SphereGeometry(0.75, 6, 6), sodiumMat);
                        lamp.position.set(pt.x, pt.y + 4.5, pt.z);
                        hwGroup.add(pier, lamp);
                    }

                    // 首都高を流れるヘッドライト＆テールランプ
                    const headMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
                    const tailMat = new THREE.MeshBasicMaterial({ color: 0xff2200 });
                    const carGeo  = new THREE.BoxGeometry(1.8, 0.9, 3.6);
                    for (let i = 0; i < 48; i++) {
                        const forward = (i % 2 === 0);
                        const car = new THREE.Mesh(carGeo, forward ? headMat : tailMat);
                        hwGroup.add(car);
                        movingCars.push({
                            type: 'curve', curve, mesh: car,
                            t: Math.random(),
                            dir: forward ? 1 : -1,
                            speed: 0.0012 + Math.random() * 0.0007,
                            offset: forward ? 2.2 : -2.2
                        });
                    }

                    scene.add(hwGroup);
                }
                buildShutokoExpressway();

                // 一般幹線道路（桜田通り・日比谷通り・大門通り・第一京浜）の街路灯と走る車
                function addStreetTrafficAndLamps(x1, z1, x2, z2, count, lampColor) {
                    const p1 = new THREE.Vector3(x1, 0.7, z1);
                    const p2 = new THREE.Vector3(x2, 0.7, z2);
                    const dirVec = p2.clone().sub(p1).normalize();
                    const rightVec = new THREE.Vector3(-dirVec.z, 0, dirVec.x);
                    const angle = Math.atan2(dirVec.x, dirVec.z);

                    // 道路沿いの街灯ドット
                    const lampMat = new THREE.MeshBasicMaterial({ color: lampColor });
                    const dist = p1.distanceTo(p2);
                    const steps = Math.floor(dist / 26);
                    for (let s = 0; s <= steps; s++) {
                        const pos = p1.clone().lerp(p2, s / steps);
                        [-7.5, 7.5].forEach(side => {
                            const l = new THREE.Mesh(new THREE.SphereGeometry(0.55, 5, 5), lampMat);
                            l.position.copy(pos).addScaledVector(rightVec, side);
                            l.position.y = 4.5;
                            scene.add(l);
                        });
                    }

                    // 走行車両
                    const headMat = new THREE.MeshBasicMaterial({ color: 0xffffee });
                    const tailMat = new THREE.MeshBasicMaterial({ color: 0xff2211 });
                    const carGeo = new THREE.BoxGeometry(1.6, 0.8, 3.2);
                    for (let i = 0; i < count; i++) {
                        const fwd = (i % 2 === 0);
                        const m = new THREE.Mesh(carGeo, fwd ? headMat : tailMat);
                        m.rotation.y = angle;
                        scene.add(m);
                        movingCars.push({
                            type: 'line', p1, p2, rightVec, mesh: m,
                            t: Math.random(),
                            dir: fwd ? 1 : -1,
                            speed: (0.28 + Math.random() * 0.22) / dist,
                            lane: fwd ? 2.8 : -2.8
                        });
                    }
                }

                // 桜田通り（赤羽橋〜神谷町：東京タワーに向かって伸びる象徴的なオレンジの光の道！）
                addStreetTrafficAndLamps(-25, 175, -145, -380, 28, 0xff9933);
                // 日比谷通り（増上寺・三解脱門前）
                addStreetTrafficAndLamps(162, -350, 162, 350, 26, 0xddeeff);
                // 大門通り（三解脱門〜大門〜浜松町）
                addStreetTrafficAndLamps(164, 0, 380, 0, 16, 0xffcc77);
                // 第一京浜（大門交差点）
                addStreetTrafficAndLamps(275, -350, 275, 350, 24, 0xffddaa);

                // 夜空の星々
                const starGeo = new THREE.BufferGeometry();
                const sVerts = [];
                for (let i = 0; i < 650; i++) {
                    const r = 800 + Math.random() * 300;
                    const th = Math.random() * Math.PI * 2;
                    const ph = Math.random() * Math.PI * 0.46;
                    sVerts.push(r * Math.sin(ph) * Math.cos(th), r * Math.cos(ph), r * Math.sin(ph) * Math.sin(th));
                }
                starGeo.setAttribute('position', new THREE.Float32BufferAttribute(sVerts, 3));
                scene.add(new THREE.Points(starGeo, new THREE.PointsMaterial({ color: 0xbcd8ff, size: 2.0 })));

                // =========================================================
                // 9. 名所案内3Dラベル（ボタンでいつでもON/OFF可能）
                // =========================================================
                const labelGroup = new THREE.Group();

                function addLandmarkLabel(text, x, y, z, borderCol) {
                    const c = document.createElement('canvas');
                    c.width = 320; c.height = 68;
                    const ctx = c.getContext('2d');
                    ctx.fillStyle = 'rgba(8, 14, 28, 0.82)';
                    ctx.strokeStyle = borderCol || '#ff8833';
                    ctx.lineWidth = 4;
                    ctx.fillRect(6, 6, 308, 56);
                    ctx.strokeRect(6, 6, 308, 56);

                    ctx.fillStyle = '#ffffff';
                    ctx.font = 'bold 23px sans-serif';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText(text, 160, 35);

                    const sp = new THREE.Sprite(new THREE.SpriteMaterial({
                        map: new THREE.CanvasTexture(c), transparent: true, depthTest: false
                    }));
                    sp.position.set(x, y, z);
                    sp.scale.set(34, 7.2, 1);
                    labelGroup.add(sp);
                }

                addLandmarkLabel('東京タワー', 0, 166, 0, '#ff5500');
                addLandmarkLabel('増上寺 大殿', 96, 31, 0, '#ffbb55');
                addLandmarkLabel('三解脱門', 148, 24, 0, '#ee4422');
                addLandmarkLabel('大門・大門通り街並み', 225, 24, 0, '#ff4433');
                addLandmarkLabel('芝公園（円形芝生広場）', 112, 16, 88, '#44cc77');
                addLandmarkLabel('ザ・プリンス パークタワー東京', 48, 88, 122, '#ffe099');
                addLandmarkLabel('東京プリンスホテル', 72, 42, -88, '#ffd288');
                addLandmarkLabel('麻布台ヒルズ', -155, 170, -85, '#ffcc77');
                addLandmarkLabel('愛宕グリーンヒルズ', 50, 112, -187, '#99ccff');
                addLandmarkLabel('赤羽橋交差点・桜田通り', -25, 22, 175, '#ff9933');
                addLandmarkLabel('首都高速都心環状線', 20, 29, 208, '#66aaff');
                addLandmarkLabel('浜松町・竹芝方面', 325, 138, 0, '#88bbff');
                scene.add(labelGroup);

                statusEl.textContent = '港区・東京タワー周辺のリアル地理モデル描画完了！視点ボタンをお試しください。';

                // =========================================================
                // 10. カメラプリセット視点切り替え ＆ 録画機能
                // =========================================================
                document.getElementById('viewOrbit').addEventListener('click', () => {
                    cam.goalTarget.set(10, 42, 0);
                    cam.goalRadius = 265;
                    cam.goalPhi = 1.18;
                    cam.autoRotate = true;
                    document.getElementById('toggleRotBtn').textContent = '自動回転: ON';
                });

                // 定番絶景1：大門・増上寺側から三解脱門と大殿越しに見上げる東京タワー！
                document.getElementById('viewZojoji').addEventListener('click', () => {
                    cam.autoRotate = false;
                    document.getElementById('toggleRotBtn').textContent = '自動回転: OFF';
                    cam.goalTarget.set(55, 42, 0);
                    cam.goalTheta = 0.03; // 東(+X:大門側)から西(東京タワー)を真っ直ぐ見る
                    cam.goalPhi = 1.38;
                    cam.goalRadius = 205;
                });

                // 定番絶景2：赤羽橋交差点・桜田通りから見上げる東京タワーと麻布台ヒルズ！
                document.getElementById('viewAkabane').addEventListener('click', () => {
                    cam.autoRotate = false;
                    document.getElementById('toggleRotBtn').textContent = '自動回転: OFF';
                    cam.goalTarget.set(-15, 52, 10);
                    cam.goalTheta = 1.62; // 南(+Z:赤羽橋側)から見上げる
                    cam.goalPhi = 1.36;
                    cam.goalRadius = 215;
                });

                // 定番絶景3：芝公園の森・プリンスパークタワー越しに見る東京タワー！
                document.getElementById('viewShiba').addEventListener('click', () => {
                    cam.autoRotate = false;
                    document.getElementById('toggleRotBtn').textContent = '自動回転: OFF';
                    cam.goalTarget.set(42, 36, 35);
                    cam.goalTheta = 0.82; // 南東(芝公園側)から見渡す
                    cam.goalPhi = 1.30;
                    cam.goalRadius = 175;
                });

                const toggleRotBtn = document.getElementById('toggleRotBtn');
                toggleRotBtn.addEventListener('click', () => {
                    cam.autoRotate = !cam.autoRotate;
                    toggleRotBtn.textContent = `自動回転: ${cam.autoRotate ? 'ON' : 'OFF'}`;
                });

                const toggleLabelBtn = document.getElementById('toggleLabelBtn');
                toggleLabelBtn.addEventListener('click', () => {
                    labelGroup.visible = !labelGroup.visible;
                    toggleLabelBtn.textContent = `名所ラベル: ${labelGroup.visible ? 'ON' : 'OFF'}`;
                });

                // 360度動画のWebM録画書き出し（18秒でゆったり1周）
                const recordBtn = document.getElementById('recordBtn');
                let isRecording = false;
                recordBtn.addEventListener('click', () => {
                    if (isRecording) return;
                    isRecording = true;
                    cam.autoRotate = true;
                    toggleRotBtn.textContent = '自動回転: ON';
                    const prevSpeed = cam.rotSpeed;
                    cam.rotSpeed = (Math.PI * 2) / (18 * 60);

                    recordBtn.classList.add('recording');
                    recordBtn.textContent = '🔴 録画中... (残り18秒)';

                    const stream = renderer.domElement.captureStream(60);
                    const mimeType = MediaRecorder.isTypeSupported('video/webm;codecs=vp9')
                        ? 'video/webm;codecs=vp9'
                        : 'video/webm';
                    const recorder = new MediaRecorder(stream, { mimeType });
                    const chunks = [];

                    recorder.ondataavailable = e => { if (e.data.size > 0) chunks.push(e.data); };
                    recorder.onstop = () => {
                        const blob = new Blob(chunks, { type: 'video/webm' });
                        const url = URL.createObjectURL(blob);
                        const a = document.createElement('a');
                        a.href = url;
                        a.download = 'tokyo_tower_shibapark_zojoji_360.webm';
                        a.click();
                        URL.revokeObjectURL(url);

                        isRecording = false;
                        cam.rotSpeed = prevSpeed;
                        recordBtn.classList.remove('recording');
                        recordBtn.textContent = '🎥 360度動画を録画 (18秒)';
                    };

                    recorder.start();
                    let sec = 18;
                    const timer = setInterval(() => {
                        sec--;
                        if (sec > 0) {
                            recordBtn.textContent = `🔴 録画中... (残り${sec}秒)`;
                        } else {
                            clearInterval(timer);
                            recorder.stop();
                        }
                    }, 1000);
                });

                // =========================================================
                // 11. アニメーションループ
                // =========================================================
                let tick = 0;
                const upVec = new THREE.Vector3(0, 1, 0);

                function animate() {
                    requestAnimationFrame(animate);
                    tick++;

                    // 航空障害灯の点滅
                    const blink = Math.sin(tick * 0.08) > 0 ? 1.25 : 0.6;
                    for (let i = 0; i < blinkingLights.length; i++) {
                        blinkingLights[i].scale.set(blink, blink, blink);
                    }

                    // 首都高＆幹線道路の車列アニメーション
                    for (let i = 0; i < movingCars.length; i++) {
                        const c = movingCars[i];
                        c.t += c.dir * c.speed;
                        if (c.t > 1) c.t -= 1;
                        if (c.t < 0) c.t += 1;

                        if (c.type === 'curve') {
                            const pt = c.curve.getPointAt(c.t);
                            const tan = c.curve.getTangentAt(c.t);
                            const side = new THREE.Vector3().crossVectors(tan, upVec).normalize();
                            c.mesh.position.copy(pt).addScaledVector(side, c.offset);
                            c.mesh.position.y += 1.6;
                            c.mesh.lookAt(pt.clone().add(tan).addScaledVector(side, c.offset));
                        } else {
                            c.mesh.position.lerpVectors(c.p1, c.p2, c.t).addScaledVector(c.rightVec, c.lane);
                        }
                    }

                    cam.update();
                    renderer.render(scene, camera);
                }

                window.addEventListener('resize', () => {
                    camera.aspect = window.innerWidth / window.innerHeight;
                    camera.updateProjectionMatrix();
                    renderer.setSize(window.innerWidth, window.innerHeight);
                });

                animate();

            } catch (err) {
                statusEl.style.color = '#ff6666';
                statusEl.textContent = 'エラー: ' + err.message;
            }
        });
    </script>
</body>
